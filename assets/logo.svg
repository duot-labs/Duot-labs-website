<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="duot-triangle-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4FF3A" />
      <stop offset="100%" stop-color="#00F5A0" />
    </linearGradient>
  </defs>
  <!-- Official Duot Triangle Mark -->
  <g transform="translate(6, 4)">
    <!-- Base Triangle -->
    <polygon points="20,2 38,36 2,36" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Center Clock Circle -->
    <circle cx="20" cy="22" r="7.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
    <!-- Center Clock Hands (90/45 degree angle) -->
    <path d="M20 18 V22 H23.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Wordmark -->
  <text x="56" y="29" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" letter-spacing="-0.03em">DUOT<tspan fill="#D4FF3A">.</tspan><tspan fill="#9DA3BA" font-weight="600" font-size="14" letter-spacing="0.12em"> LABS</tspan></text>
</svg>
